---
layout: default
---
<article class="sw-home sf-post">
  <header class="sw-home__hero">
    <span class="sw-home__chip">
      <span class="sw-home__label">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% for tag in page.tags %} · {{ tag }}{% endfor %}
      </span>
    </span>
    <h1 class="sw-home__title">{{ page.title }}</h1>
  </header>

  <div class="sf-post__body">
    {{ content }}
  </div>

  <hr class="sw-home__wave-line">

  <nav class="sf-post__nav" aria-label="More posts">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>{% endif %}
  </nav>

  {% include waitlist.html %}
</article>
